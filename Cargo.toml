[package]
name = "mail-classifier"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gpui-kit = "0.7"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }

[profile.dev]
debug = "line-tables-only"
