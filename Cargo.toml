[package]
name = "mail-classifier"
version = "0.1.0"
edition = "2024"

[features]
# Test data (fake mailbox, accounts, contacts). Only the tests turn it on, via the
# self dev-dependency below; the app binary never includes it.
fixtures = []

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gpui-kit = "0.7"
regex = "1"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-wry = "0.7.0"
wry = { version = "0.53.3", package = "lb-wry" }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
# NSPasteboard carries the composer's rich-text clipboard flavor.
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-web-kit = "0.3"

# Composer: Markdown parsing (pulldown-cmark) and HTML parsing (scraper on
# html5ever). Block and inline structure comes from those parsers; the HTML and
# plain-text renderers and the HTML -> Markdown conversion are ours.
pulldown-cmark = "0.13"
scraper = "0.27"
ego-tree = "0.11"
# Reading MIME back (mock provider, imported draft originals).
mailparse = "0.17"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
parking_lot = "0.12"
mail-classifier = { path = ".", features = ["fixtures"] }

[profile.dev]
debug = "line-tables-only"
