[package]
name = "mail-classifier"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gpui-kit = "0.7"
regex = "1"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7", default-features = false, features = ["system-fonts", "complex-scripts"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7" }
anyrender = "=0.13.0"
anyrender_vello_cpu = "=0.17.0"
data-url = "0.3.1"
peniko = "0.6.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[patch.crates-io]
# Stylo's ToCss derive leaves a nested Result error type unconstrained.
# GPUI's serde_fmt dependency adds a second From impl for fmt::Error.
stylo_derive = { path = "vendor/stylo_derive" }

[patch."https://github.com/DioxusLabs/blitz"]
# Collapsed-table painting must honor none/hidden and each edge's style.
blitz-paint = { path = "vendor/blitz-paint" }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
parking_lot = "0.12"

[profile.dev]
debug = "line-tables-only"
