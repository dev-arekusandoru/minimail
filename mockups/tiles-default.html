<!doctype html>
<meta charset="utf-8">
<title>Sender tiles</title>
<style>
/* Tiles replace the rail. Left: 32px tile (+ unread badge top-right). Middle: subject line (account icon, subject, message-count chip) / sender + preview.
   Right column: time on line 1, status icons on line 2. */
:root{--bg:#282c34;--fg:#abb2bf;--strong:#d7dae0;--muted:#7f848e;--border:#3b4048;--active:#3e4451;--hover:#323842;--accent:#323842;--primary:#61afef;--danger:#e06c75;--warn:#d19a66;--purple:#c678dd;--cyan:#56b6c2;--green:#98c379;--yellow:#e5c07b}
*{box-sizing:border-box;margin:0}
i{font-style:normal}
body{background:#1e2127;color:var(--fg);font:14px/18px -apple-system,system-ui,sans-serif;padding:24px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.col{width:420px}
h2{font:600 12px/16px ui-monospace,monospace;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.sec{flex-basis:100%;font:600 13px/18px ui-monospace,monospace;color:var(--strong);border-bottom:1px solid var(--border);padding-bottom:6px}
.list{background:var(--bg);border:1px solid var(--border)}
.day{height:22px;padding:6px 10px 0 11px;font:600 10px/14px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;padding-right:9px}
.day .chev{margin-left:auto;width:12px;height:12px;opacity:0}
.day:hover .chev{opacity:1}
.cap{height:16px;padding:0 11px;font:10px/16px ui-monospace,monospace;color:var(--muted);opacity:.7}

.row{--rowbg:var(--bg);position:relative;display:flex;align-items:center;width:100%;border:1px solid transparent;padding:0 8px 0 10px;background:var(--rowbg)}
.row:hover{--rowbg:var(--hover)}
.row.cur{--rowbg:var(--active);border-color:rgba(97,175,239,.8)}
.row.open,.row.sel{--rowbg:#2f3a4a}
.row.cur.open,.row.cur.sel{--rowbg:var(--active)}
.row.open::before,.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.in{display:flex;gap:10px;align-items:flex-start;width:100%;min-width:0;padding:4px 0}

/* tile wrapper: 32x32, variants draw inside it */
.tw{position:relative;width:32px;height:32px;flex:none;margin-top:1px}
.tile{position:absolute;inset:0;border-radius:8px;display:grid;place-items:center;font:600 14px/1 -apple-system,system-ui,sans-serif;color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg))}
.tile .ck{display:none;width:15px;height:15px;stroke:#282c34;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sel .tile{background:var(--primary);color:#282c34}
.sel .tile .l0{display:none} .sel .tile .ck{display:block}
/* unread badge: dot for 1, number for 2+; ringed with the row background */
.ub{position:absolute;top:-6px;right:-6px;z-index:5;width:12px;height:12px;border-radius:50%;border:2px solid var(--rowbg);background:var(--primary)}
.ub.n{width:auto;min-width:16px;height:16px;padding:0 3px;border-radius:8px;color:#282c34;font:700 9px/12px ui-monospace,monospace;text-align:center}

.body{flex:1;min-width:0}
.l{height:18px;display:flex;align-items:center;gap:6px;min-width:0}
.t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--strong)}
.l .t{flex:0 1 auto}
.unread .t{font-weight:600}
.rc{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.tm{height:18px;font-size:11px;line-height:18px;color:var(--muted)}
.unread .tm{color:var(--primary)}
.icons{height:16px;display:flex;gap:4px;align-items:center}
.ic{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p{font-size:12px;line-height:16px;color:var(--muted);max-height:32px;overflow:hidden;overflow-wrap:anywhere}
.p b{font-weight:400;color:var(--fg)} .unread .p b{font-weight:600}
.more{color:var(--muted)}
.k{color:var(--primary)} .m{color:var(--muted)} .sp{color:var(--danger)} .ns{color:var(--warn)}
.cnt2{font-size:11px;line-height:16px;padding:0 6px;border-radius:4px;background:var(--accent);color:var(--muted);white-space:nowrap;flex:none}
.tc{color:var(--muted)} .thread:not(.exp) .tc{transform:rotate(-90deg)}
.kid{--rowbg:#24282f;padding-left:34px}
.kid .tw{width:24px;height:24px;margin-top:0}
.kid .tile{border-radius:6px;font-size:12px}
.kid .ub{top:-5px;right:-5px;width:10px;height:10px}
.kid .l .t{color:var(--fg);font-weight:400} .kid.unread .l .t{color:var(--strong);font-weight:600}

/* ---- group tile variants ---- */
.ltr{display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg));font-weight:600}
.neu{color:var(--muted);background:var(--accent)}
/* A deck: main tile on top, 1-2 edges peeking bottom-right */
.deck .d{position:absolute;width:26px;height:26px;border-radius:7px;box-shadow:0 0 0 2px var(--rowbg);font-size:13px}
.deck .d.b{color:transparent;background:color-mix(in srgb,var(--c) 32%,var(--bg))}
.deck .ub{right:0}
/* B mosaic: one tile split into 2 / 3 / 4 cells */
.mos{position:absolute;inset:0;border-radius:8px;background:var(--accent);padding:2px;display:grid;gap:2px}
.mos .ltr{border-radius:5px;font-size:9px;line-height:1}
.mos.m2{grid-template-columns:1fr 1fr} .mos.m2 .ltr{font-size:11px}
.mos.m3,.mos.m4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mos.m3 .ltr:first-child{grid-row:span 2;font-size:12px}
/* C pair: two small tiles overlapping on the diagonal; latest in front */
.pair .d{position:absolute;width:20px;height:20px;border-radius:6px;font-size:10px}
.pair .d.f{left:0;top:0;z-index:2;box-shadow:0 0 0 2px var(--rowbg)}
.pair .d:not(.f){left:12px;top:12px;padding:4px 0 0 4px;font-size:9px}
.pair .ub{top:6px}
.selt{display:none;position:absolute;inset:0;border-radius:8px;background:var(--primary);place-items:center;z-index:6}
.selt svg{width:15px;height:15px;stroke:#282c34;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sel .selt{display:grid}
.sel .tw>:not(.selt):not(.ub){visibility:hidden}
/* D ring: latest sender's tile inside a ring split into one segment per sender */
.ring{position:absolute;inset:0;border-radius:10px;padding:2px;background:var(--rg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.rt{position:absolute;inset:4px;border-radius:6px;font-size:13px}
.gal{display:flex;gap:18px;align-items:center;padding:14px 16px;background:var(--bg);border:1px solid var(--border);--rowbg:var(--bg);zoom:1.5;margin-bottom:10px}
.gal .tw{margin:0}
.gal small{font:9px ui-monospace,monospace;color:var(--muted);display:block;text-align:center;margin-top:6px}
.gal>div{display:flex;flex-direction:column;align-items:center}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="paperclip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
<symbol id="newspaper" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"/></symbol>
<symbol id="receipt" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1zM12 8v4M12 16h.01"/></symbol>
<symbol id="userplus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M19 8v6M22 11h-6"/><circle cx="9" cy="7" r="4"/></symbol>
<symbol id="belloff" viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7M10.3 21a1.94 1.94 0 0 0 3.4 0M2 2l20 20"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="folderinput" viewBox="0 0 24 24"><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1M2 13h10m-3-3 3 3-3 3"/></symbol>
<symbol id="siren" viewBox="0 0 24 24"><path d="M7 18v-6a5 5 0 1 1 10 0v6M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2zM21 12h1M18.5 4.5 18 5M2 12h1M12 2v1M4.929 4.929l.707.707M12 12v6"/></symbol>
<symbol id="flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="work" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></symbol>
<symbol id="school" viewBox="0 0 24 24"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0zM22 10v6M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>

<script>
const ACCT = {personal:['home','var(--cyan)'], work:['work','var(--primary)'], school:['school','var(--purple)']};
const KIND = {news:['newspaper','k'], receipt:['receipt','k'], notif:['bell','k'], person:['user','k']};
const PAL = ['var(--cyan)','var(--primary)','var(--purple)','var(--warn)','var(--green)','var(--danger)','var(--yellow)'];
const hue = s => PAL[[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%PAL.length];
const L = n => n[0].toUpperCase();
const ic = (n, c='') => `<svg class="ic ${c}"><use href="#${n}"/></svg>`;
const ltr = (n, cls='', style='') => `<i class="ltr ${cls}" style="--c:${hue(n)};${style}">${L(n)}</i>`;
const neu = (txt, cls='', style='') => `<i class="ltr neu ${cls}" style="${style}">${txt}</i>`;

// ---- tile variants: names are newest-first ----
const TILE = {
  latest: names => `<div class="tile" style="--c:${hue(names[0])}"><span class="l0">${L(names[0])}</span>${ic('check','ck')}</div>`,
  deck: names => {
    if (names.length < 2) return TILE.latest(names);
    const o = names.length > 2 ? [6,3] : [3];
    const back = o.map((off,i) => `<i class="d b ltr" style="--c:${hue(names[o.length-i])};left:${off}px;top:${off}px">.</i>`).join('');
    return `<div class="deck">${back}${ltr(names[0],'d')}</div>`;
  },
  mosaic: names => {
    if (names.length < 2) return TILE.latest(names);
    const n = names.length, cells = n>4 ? [...names.slice(0,3).map(x=>ltr(x)), neu('+'+(n-3))] : names.map(x=>ltr(x));
    return `<div class="mos m${Math.min(n,4)}">${cells.join('')}</div>`;
  },
  pair: names => {
    if (names.length < 2) return TILE.latest(names);
    const back = names.length > 2 ? neu('+'+(names.length-1),'d') : ltr(names[1],'d');
    return `<div class="pair">${back}${ltr(names[0],'d f')}</div>`;
  },
  ring: names => {
    if (names.length < 2) return TILE.latest(names);
    const seg = names.slice(0,6).map(n => hue(n)), more = names.length > 6;
    const k = seg.length, s = 360/k, g = 14;
    const stops = seg.map((c,i) => `${c} ${i*s+g/2}deg ${(i+1)*s-g/2}deg,transparent ${(i+1)*s-g/2}deg ${(i+1)*s+g/2}deg`).join(',');
    return `<i class="ring" style="--rg:conic-gradient(from ${-g/2}deg,${stops})"></i>${ltr(names[0],'rt')}`;
  },
};
const ub = n => n>1 ? `<i class="ub n" title="${n} unread messages">${n}</i>` : n==1 ? '<i class="ub" title="1 unread message"></i>' : '';

const MSGS = [
 {day:'Today', time:'9:41', acct:'personal', unread:1, kind:'news', attach:1, folder:1, subj:'helumi just got its first big update 🎉', from:'helumi', pre:'your files on every device, and more'},
 {day:'Oct 13', time:'17:02', acct:'work', unread:1, kind:'receipt', folder:1, urgency:'urgent', subj:'Updated Apple Developer Program License Agreement', from:'Apple Developer', pre:'Hello, The Apple Developer Program License Agreement has been revised to support new features and updated policies, and to'},
 {time:'14:20', acct:'school', kind:'notif', muted:1, folder:1, subj:'You have been tagged in a post', from:'First Tee Alumni Network', pre:'(https://us.links.graduway.com/ls/click?upn=u001.j-2FvyL6nXwHA3Egmr4rHP9yTR-2FLK7N-2BtWiJFAO'},
 {time:'11:08', acct:'personal', kind:'news', newsender:1, spam:1, attach:1, urgency:'very', subj:'Forget your bench press', from:'Trevor Shan', pre:'"How much do you bench?" Worst question in fitness. It tells you one thing. How much a man can push off his chest, once, ly'},
 {thread:1, time:'20:31', acct:'personal', kind:'person', subj:'Dinner Sunday?', unread:2, attach:1, msgs:[
   {time:'20:31', from:'Mom', unread:1, pre:'Sounds good, see you then! Dad says to bring the good wine and an appetite, we are making way too much food again'},
   {time:'19:58', from:'You', pre:"Great, I'll bring dessert"},
   {time:'19:40', from:'Dad', unread:1, attach:1, pre:'I can pick up the wine on the way, here is the menu we were thinking about for Sunday'},
   {time:'19:12', from:'Mom', pre:'Are you free around 6 on Sunday? Dad and I are thinking of cooking something nice'}]},
 {time:'9:15', acct:'school', kind:'news', snoozed:1, subj:'October 2026 Messiah University Alumni Newsletter', from:'Office of Alumni and Parent Relations', pre:"Welcome to this month's alumni update! We're sharing upcoming events, campus news, and opportunities to stay connected"},
 {time:'8:02', acct:'work', kind:'notif', subj:'Build passed', from:'GitHub', pre:'All checks have passed on main'},
];
function icons(m){
  const g=[];
  if(m.folder) g.push(['folderinput','k']);
  if(m.spam) g.push(['shield','sp']);
  if(m.urgency) g.push(m.urgency=='very'?['siren','sp']:['flame','ns']);
  if(m.newsender) g.push(['userplus','ns']);
  if(m.snoozed) g.push(['clock','m']);
  if(m.muted) g.push(['belloff','m']);
  if(m.attach) g.push(['paperclip','m']);
  g.push(KIND[m.kind]);
  return g.map(([n,c])=>ic(n,c)).join('');
}
const acctIcon = (m,o) => { if(!o.all) return ''; const [ai,ac]=ACCT[m.acct]; return `<svg class="ic" style="color:${ac}"><use href="#${ai}"/></svg>`; };
const people = (names, pre) => `<b>${names.slice(0,3).join(', ')}</b>${names.length>3?` <span class="more">+${names.length-3}</span>`:''}${pre?' · '+pre:''}`;

function row(m,o){
  const cls=['row',m.unread?'unread':'',...(o.cls||[])].join(' ');
  return `<div class="${cls}"><div class="in"><div class="tw">${TILE.latest([m.from])}${ub(m.unread?1:0)}</div><div class="body">
    <div class="l">${acctIcon(m,o)}<span class="t">${m.subj}</span></div>
    <div class="p"><b>${m.from}</b> · ${m.pre}</div></div>
    <div class="rc"><span class="tm">${m.time}</span><span class="icons">${icons(m)}</span></div></div></div>`;
}
// T: {subj,names,count,unread,pre,time,kind,attach,acct,msgs?}
function thread(T,o){
  const cls=['row','thread',T.unread?'unread':'',o.expanded?'exp':'',...(o.cls||[])].join(' ');
  const head=`<div class="${cls}"><div class="in"><div class="tw">${(o.tile||TILE.latest)(T.names)}<i class="selt">${ic('check')}</i>${ub(T.unread)}</div><div class="body">
    <div class="l">${acctIcon(T,o)}<span class="t">${T.subj}</span><span class="cnt2" title="${T.count} messages in this thread">${T.count}</span></div>
    <div class="p">${o.expanded?`<b>${T.names.slice(0,3).join(', ')}</b>`:people(T.names,T.pre)}</div></div>
    <div class="rc"><span class="tm">${T.time}</span><span class="icons">${icons({kind:T.kind,attach:T.attach})}${ic('chevron','tc')}</span></div></div></div>`;
  const kids=o.expanded?T.msgs.map((m,i)=>`<div class="row kid ${m.unread?'unread':''} ${i==o.cur?'cur':''}"><div class="in"><div class="tw">${TILE.latest([m.from])}${ub(m.unread?1:0)}</div><div class="body"><div class="l"><span class="t">${m.from}</span></div><div class="p">${m.pre}</div></div><div class="rc"><span class="tm">${m.time}</span><span class="icons">${m.attach?ic('paperclip','m'):''}</span></div></div></div>`).join(''):'';
  return head+kids;
}
const fromMsg = M => ({...M, names:[...new Set(M.msgs.map(m=>m.from))], count:M.msgs.length, pre:M.msgs[0].pre});
const col = (title,html) => document.body.insertAdjacentHTML('beforeend',`<div class="col"><h2>${title}</h2><div class="list">${html}</div></div>`);
const sec = t => document.body.insertAdjacentHTML('beforeend',`<div class="sec">${t}</div>`);
function list(title,o){
  let h='',day;
  MSGS.forEach((m,i)=>{ if(m.day&&m.day!==day){day=m.day;h+=`<div class="day">${day}${ic('chevron','chev')}</div>`}
    h+=m.thread?thread(fromMsg(m),o):row(m,{...o,cls:i==0?['cur']:[]}); });
  col(title,h);
}

sec('Sender tiles · icons under the time · unread badge top-right (dot = 1, number = 2+) · grey chip = message count');
list('Single account',{});
list('All Inboxes (account icon before the subject)',{all:true});
sec('Thread expanded · row states');
list('Thread expanded',{expanded:1,cur:2});
{ let h=''; [['normal',[]],['hover',['hv']],['cursor',['cur']],['open',['open']],['selected',['sel']],['cursor + selected',['cur','sel']]].forEach(([n,c])=>h+=`<div class="cap">${n}</div>`+row(MSGS[1],{cls:c}));
  col('States',h); document.querySelector('.hv').style.setProperty('--rowbg','var(--hover)'); }

// ---- grouped-thread tile approaches ----
const NAMES=['Priya','Marcus','Dana','Lee','Sofia','Omar','Hannah','Chen','Ravi','Elena','Tom','Grace'];
const G = [
 {subj:'Dinner Sunday?', names:['Mom','You'], count:4, unread:1, pre:'Sounds good, see you then!', time:'20:31', kind:'person', attach:1, acct:'personal'},
 {subj:'Q4 offsite: venue and budget', names:NAMES.slice(0,3), count:9, unread:3, pre:'Can we lock the venue by Friday?', time:'16:48', kind:'person', acct:'work'},
 {subj:'Re: Alumni weekend plans', names:NAMES.slice(3,8), count:14, unread:0, pre:'I can host Saturday brunch if people want', time:'13:20', kind:'person', acct:'school'},
 {subj:'Weekly digest: everyone please read', names:NAMES, count:128, unread:2, pre:'Thanks all, notes are in the shared doc now', time:'11:05', kind:'notif', acct:'work'},
];
const REF = {day:'Oct 12', time:'9:15', acct:'school', kind:'news', subj:'October 2026 Messiah University Alumni Newsletter', from:'Office of Alumni', pre:"Welcome to this month's alumni update!"};
const gallery = fn => `<div class="gal">${G.map(T=>`<div><div class="tw">${fn(T.names)}${ub(T.unread)}</div><small>${T.names.length} senders</small></div>`).join('')}</div>`;
sec('Setting: Group tile style · Ring (default) / Deck / Mosaic / Pair · rows end with a selected thread');
for (const [k,t] of [['ring','Ring (default): latest sender inside a ring, one segment per sender'],['deck','Deck: latest sender on top, others peek behind'],['mosaic','Mosaic: one tile split per sender (+N past 4)'],['pair','Pair: latest sender top-left on top, +N tile bottom-right beneath']]) {
  document.body.insertAdjacentHTML('beforeend',`<div class="col"><h2>${t}</h2>${gallery(TILE[k])}<div class="list">${G.map(T=>thread(T,{tile:TILE[k]})).join('')}${thread(G[1],{tile:TILE[k],cls:['sel']})}${row(REF,{})}</div></div>`);
}
</script>
