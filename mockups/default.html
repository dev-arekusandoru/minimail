<!doctype html>
<meta charset="utf-8">
<title>Default row</title>
<style>
/* Geometry mirrors src/app/row.rs frame(): border 1, pl 10, pr 8, gap 8; lines 18 / preview 16. */
:root{--bg:#282c34;--fg:#abb2bf;--strong:#d7dae0;--muted:#7f848e;--border:#3b4048;--active:#3e4451;--hover:#323842;--accent:#323842;--primary:#61afef;--danger:#e06c75;--warn:#d19a66;--purple:#c678dd;--cyan:#56b6c2}
*{box-sizing:border-box;margin:0}
body{background:#1e2127;color:var(--fg);font:14px/18px -apple-system,system-ui,sans-serif;padding:24px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.col{width:420px}
h2{font:600 12px/16px ui-monospace,monospace;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.list{background:var(--bg);border:1px solid var(--border);position:relative}
/* the rail: one 1px line behind every row, x = 10 + 1 + gutter 40 + gap 8 + dot/2 */
.list::after{content:"";position:absolute;left:62px;top:0;bottom:0;width:1px;background:var(--border);pointer-events:none}
.day{height:22px;padding:6px 10px 0 11px;font:600 10px/14px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.day{display:flex;align-items:center;gap:4px;padding-right:9px;cursor:pointer;user-select:none;position:relative;z-index:1}
.day .chev{margin-left:auto;width:12px;height:12px;opacity:0;transition:opacity .1s}
.day:hover .chev,.grp.collapsed .chev{opacity:1}
.grp.collapsed .row{display:none}
.grp:not(.collapsed) .cnt{display:none}
.grp.collapsed .chev{transform:rotate(-90deg)}
.cap{height:16px;padding:0 11px;font:10px/16px ui-monospace,monospace;color:var(--muted);opacity:.7;position:relative;z-index:1}

.row{--rowbg:var(--bg);position:relative;display:flex;align-items:center;width:100%;border:1px solid transparent;padding:0 8px 0 10px;background:var(--rowbg)}
.row:hover{--rowbg:var(--hover)}
.row.cur{--rowbg:var(--active);border-color:rgba(97,175,239,.8)}
.row.open,.row.sel{--rowbg:#2f3a4a} /* primary @ .14 over bg */
.row.cur.open,.row.cur.sel{--rowbg:var(--active)}
.row.partial::before,.row.open::before,.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.row.partial::before{opacity:.45}
.in{display:flex;gap:8px;align-items:flex-start;width:100%;min-width:0;padding:4px 0}
.gut{width:40px;flex:none;text-align:right;font-size:11px;line-height:18px;color:var(--muted);position:relative;z-index:1}
.unread .gut{color:var(--primary)}
.mark{width:7px;flex:none;position:relative;z-index:1;height:18px}
.dot{position:absolute;left:0;top:5.5px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--c,var(--muted));background:var(--rowbg)}
.unread .dot{background:var(--c,var(--primary));border-color:var(--c,var(--primary))}
.sel .dot{width:13px;height:13px;left:-3px;top:2.5px;background:var(--primary);border-color:var(--primary);display:grid;place-items:center}
.sel .dot svg{width:9px;height:9px;stroke:#282c34;stroke-width:3.5}
.body{flex:1;min-width:0}
.l{height:18px;display:flex;align-items:center;gap:4px;min-width:0}
.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--strong)}
.unread .t{font-weight:600}
.ic{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icons{display:flex;gap:4px;align-items:center;flex:none}
.p{max-height:32px;font-size:12px;line-height:16px;color:var(--muted);overflow:hidden;overflow-wrap:anywhere}
.p b{font-weight:400;color:var(--fg)} .unread .p b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:3px;height:16px;padding:0 6px;border-radius:4px;background:var(--accent);font-size:11px;line-height:16px;white-space:nowrap;color:var(--primary)}
.chip .ic{width:11px;height:11px}
.chip.urgent{color:var(--warn)} .chip.very{color:var(--danger)}
.k{color:var(--primary)} .m{color:var(--muted)} .sp{color:var(--danger)} .ns{color:var(--warn)}
</style>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="paperclip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
<symbol id="newspaper" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"/></symbol>
<symbol id="receipt" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1zM12 8v4M12 16h.01"/></symbol>
<symbol id="userplus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M19 8v6M22 11h-6"/><circle cx="9" cy="7" r="4"/></symbol>
<symbol id="belloff" viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7M10.3 21a1.94 1.94 0 0 0 3.4 0M2 2l20 20"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="folderinput" viewBox="0 0 24 24"><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1M2 13h10m-3-3 3 3-3 3"/></symbol>
<symbol id="siren" viewBox="0 0 24 24"><path d="M7 18v-6a5 5 0 1 1 10 0v6M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2zM21 12h1M18.5 4.5 18 5M2 12h1M12 2v1M4.929 4.929l.707.707M12 12v6"/></symbol>
<symbol id="flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="work" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></symbol>
<symbol id="school" viewBox="0 0 24 24"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0zM22 10v6M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>

<script>
const ACCT = {personal:['home','var(--cyan)'], work:['work','var(--primary)'], school:['school','var(--purple)']};
const KIND = {news:['newspaper','k'], receipt:['receipt','k'], notif:['bell','k'], person:['user','k']};
// flags: spam, newsender, muted, snoozed, attach. folder / urgency become chips when chips are on, icons otherwise.
const MSGS = [
 {day:'Today', time:'9:41', acct:'personal', unread:1, kind:'news', attach:1, folder:'Newsletters',
  subj:'helumi just got its first big update 🎉', from:'helumi', pre:'your files on every device, and more'},
 {day:'Oct 13', time:'17:02', acct:'work', unread:1, kind:'receipt', folder:'Apple', urgency:'urgent',
  subj:'Updated Apple Developer Program License Agreement Now Available', from:'Apple Developer', pre:'Hello, The Apple Developer Program License Agreement has been revised to support new features and updated policies, and to'},
 {time:'14:20', acct:'school', kind:'notif', muted:1, folder:'Social',
  subj:'You have been tagged in a post', from:'First Tee Alumni Network', pre:'(https://us.links.graduway.com/ls/click?upn=u001.j-2FvyL6nXwHA3Egmr4rHP9yTR-2FLK7N-2BtWiJFAO'},
 {time:'11:08', acct:'personal', kind:'news', newsender:1, spam:1, attach:1, urgency:'very',
  subj:'Forget your bench press', from:'Trevor Shan', pre:'"How much do you bench?" Worst question in fitness. It tells you one thing. How much a man can push off his chest, once, ly'},
 {time:'9:15', acct:'school', kind:'news', snoozed:1,
  subj:'October 2026 Messiah University Alumni Newsletter', from:'Office of Alumni and Parent Relations', pre:"Welcome to this month's alumni update! We're sharing upcoming events, campus news, and opportunities to stay connected"},
 {day:'Oct 12', time:'20:31', acct:'personal', kind:'person',
  subj:'Dinner Sunday?', from:'Mom', pre:'Are you free around 6?'},
 {time:'8:02', acct:'work', kind:'notif',
  subj:'Build passed', from:'GitHub', pre:'All checks have passed on main'},
 {day:'Oct 11', time:'18:44', acct:'personal', kind:'receipt', folder:'Receipts',
  subj:'Your receipt from Blue Bottle', from:'Blue Bottle', pre:'Thanks for stopping by'},
 {time:'10:10', acct:'school', kind:'news',
  subj:'Campus news digest', from:'Messiah', pre:'This week on campus'},
];
const COLLAPSED = new Set(['Oct 11']);
const ic = (n, c='') => `<svg class="ic ${c}"><use href="#${n}"/></svg>`;
function chips(m){
  const out=[];
  if(m.folder) out.push(`<span class="chip">${ic('folderinput')}${m.folder}</span>`);
  if(m.urgency) out.push(`<span class="chip ${m.urgency}">${ic(m.urgency=='very'?'siren':'flame')}${m.urgency=='very'?'Very urgent':'Urgent'}</span>`);
  return out.length ? `<div class="l">${out.join('')}</div>` : '';
}
// Glyph::ALL order; folder + urgency icons only when chips are off (the chips carry them otherwise).
function iconsOf(m, chipsOn){
  const g=[];
  if(!chipsOn && m.folder) g.push(['folderinput','k']);
  if(m.spam) g.push(['shield','sp']);
  if(!chipsOn && m.urgency) g.push(m.urgency=='very'?['siren','sp']:['flame','ns']);
  if(m.newsender) g.push(['userplus','ns']);
  if(m.snoozed) g.push(['clock','m']);
  if(m.muted) g.push(['belloff','m']);
  if(m.attach) g.push(['paperclip','m']);
  g.push(KIND[m.kind]);
  return g.map(([n,c])=>ic(n,c)).join('');
}
function row(m, o){
  const [ai, ac] = ACCT[m.acct];
  const ch = chips(m);
  const above = o.chips=='above' ? ch : '', below = o.chips=='below' ? ch : '';
  const acct = o.all ? `<svg class="ic" style="color:${ac}"><use href="#${ai}"/></svg>` : '';
  const cls = ['row', m.unread?'unread':'', ...(o.cls||[])].join(' ');
  const style = o.all ? `--c:${ac}` : '';
  const check = (o.cls||[]).includes('sel') ? ic('check') : '';
  return `<div class="${cls}" style="${style}"><div class="in">
    <div class="gut">${m.time}</div><div class="mark"><i class="dot">${check}</i></div>
    <div class="body">${above}
      <div class="l">${acct}<span class="t">${m.subj}</span><span class="icons">${iconsOf(m, o.chips!='off')}</span></div>
      <div class="p"><b>${m.from}</b> · ${m.pre}</div>${below}
    </div></div></div>`;
}
function list(title, o){
  const days=[]; MSGS.forEach(m=>{ if(m.day) days.push({day:m.day, rows:[]}); days.at(-1).rows.push(m); });
  let h='';
  days.forEach((d,di)=>{
    const rows=d.rows.map((m,i)=>row(m, {...o, cls:(di==0&&i==0?['cur']:[])})).join('');
    h+=`<div class="grp${COLLAPSED.has(d.day)?' collapsed':''}"><div class="day" onclick="this.parentNode.classList.toggle('collapsed')">${d.day}<span class="cnt">· ${d.rows.length}</span>${ic('chevron','chev')}</div>${rows}</div>`;
  });
  document.body.insertAdjacentHTML('beforeend', `<div class="col" id="${o.id}"><h2>${title}</h2><div class="list">${h}</div></div>`);
}
list('Default · single account · chips off', {id:'a', chips:'off'});
list('Default · All Inboxes', {id:'b', chips:'off', all:true});
list('Chips above · All Inboxes', {id:'c', chips:'above', all:true});
list('Chips below · single account', {id:'d', chips:'below'});

// states column: same message in every state
const S = [['normal',[]],['hover',['hv']],['cursor',['cur']],['open (in reader)',['open']],['selected (bulk)',['sel']],['cursor + selected',['cur','sel']],['partial (thread)',['partial']]];
let h='';
S.forEach(([n,c])=>{ h+=`<div class="cap">${n}</div>`+row(MSGS[1], {chips:'off', cls:c}); });
document.body.insertAdjacentHTML('beforeend', `<div class="col" id="e"><h2>States</h2><div class="list">${h}</div></div>`);
document.querySelector('.hv').style.setProperty('--rowbg','var(--hover)');
</script>
